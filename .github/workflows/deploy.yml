name: Deploy Sinhala Buddhist Gatha Website to GitHub Pages

"on":
  push:
    branches: ["main", "master"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want those deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Quality gate: verify data and asset integrity before publishing
  verify:
    name: Verify Data & Asset Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Pre-deployment Integrity Verification
        run: |
          python3 -c "
          import json, os, re

          # 1. Verify assets/data/gathas.json is valid
          with open('assets/data/gathas.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          assert isinstance(data, list) and len(data) > 0, 'gathas.json must contain a list of items'
          print(f'✓ Validated assets/data/gathas.json ({len(data)} items found)')

          # 2. Verify all image references exist on disk
          for item in data:
              img = item.get('image')
              assert img, f'Missing image field in item: {item.get(\"id\")}'
              assert os.path.exists(img), f'Referenced image not found on disk: {img}'
          print('✓ All image assets exist on disk')

          # 3. Verify index.html embedded fallback data
          with open('index.html', 'r', encoding='utf-8') as f:
              html = f.read()
          m = re.search(r'<script id=\"gathasData\" type=\"application/json\">\s*(\[.*?\])\s*</script>', html, re.DOTALL)
          assert m, 'index.html must contain #gathasData JSON script'
          embedded = json.loads(m.group(1))
          assert len(embedded) == len(data), 'Embedded data count does not match gathas.json'
          print('✓ Verified index.html embedded fallback data matches gathas.json')
          "

  # Deployment job to GitHub Pages
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Prevent placeholder comments in CNAME from triggering GitHub Pages DNS error
      - name: Validate CNAME configuration
        run: |
          if [ -f CNAME ]; then
            if grep -q "^#" CNAME; then
              echo "CNAME file contains placeholder comments. Removing to avoid DNS error on GitHub Pages."
              rm CNAME
            fi
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
